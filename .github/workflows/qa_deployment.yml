name: 'QA Deployment'

# Ensure only one deployment runs at a time
concurrency: 1

# Trigger workflow when changes are pushed to dev_branch
on:
  push:
    branches:
      - dev_branch
    paths:
      - 'my_first_bundle/**'

jobs:
  deploy:
    name: 'Deploy bundle'
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Install Databricks CLI
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      # Deploy bundle to QA environment
      - name: Deploy bundle to QA
        run: databricks bundle deploy
        working-directory: my_first_bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.QA_TOKEN }}
          DATABRICKS_BUNDLE_ENV: qa
